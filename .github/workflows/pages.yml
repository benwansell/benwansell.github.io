name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  schedule:
    - cron: '30 6 * * *'   # every day at 06:30 UTC, to refresh the "Latest" cards
  workflow_dispatch:

permissions:
  contents: read
  actions: read   # the wait step lists this run's artifacts
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Refresh the front page's "Latest" cards from Prospect, Substack and Rethink.
      # If a source is unreachable the previous card is kept, and the site still deploys.
      - name: Update Latest cards
        run: python3 scripts/update_now.py
        continue-on-error: true
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      # deploy-pages queries the artifacts API less than a second after the
      # upload finalises, and often gets back 0 results because the listing has
      # not caught up yet. Wait for the artifact to be visible before deploying.
      - name: Wait for the artifact to appear in the API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 30); do
            count=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?name=github-pages" --jq '.total_count')
            if [ "$count" -ge 1 ]; then
              echo "artifact visible after ${i} attempt(s)"
              exit 0
            fi
            sleep 5
          done
          echo "artifact never became visible" >&2
          exit 1
      - id: deployment
        uses: actions/deploy-pages@v4
